apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-ci-cd
  namespace: java-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-ci-cd
  template:
    metadata:
      labels:
        app: java-ci-cd
    spec:
      containers:
      - name: java-ci-cd
        image: keneanyaragbu/java-ci-cd:latest
        ports:
        - containerPort: 8080
